# pnpm v11+ 项目级配置载体。
# 注意:pnpm v11 起不再读取 package.json 的 "pnpm" 字段,原
# "pnpm.onlyBuiltDependencies" 已失效,等价配置为下面的 allowBuilds。
# 省略 packages 字段时只包含根包 —— 单包项目合法。

# 允许执行安装脚本的依赖(未列出的包视为未审阅,strictDepBuilds 默认 true 会报错)
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - prettier-plugin-astro@1.1.1
